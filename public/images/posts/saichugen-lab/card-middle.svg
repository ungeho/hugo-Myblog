<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" role="img" aria-labelledby="title">
<title id="title">3枚の中央のカードだけがラウンド得点を得る</title>
<rect width="600" height="390" rx="20" fill="#f8fafc"/>
<g font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif" fill="#172033">
<text x="300" y="42" text-anchor="middle" font-size="27" font-weight="700">3人が同時に公開 → 強さを比較</text>
<text x="300" y="82" text-anchor="middle" font-size="23">弱い ← 数字を優先して並べる → 強い</text>
<rect x="24" y="105" width="168" height="182" rx="14" fill="white" stroke="#64748b" stroke-width="2"/>
<rect x="216" y="105" width="168" height="182" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="4"/>
<rect x="408" y="105" width="168" height="182" rx="14" fill="white" stroke="#64748b" stroke-width="2"/>
<g text-anchor="middle" font-size="24"><text x="108" y="144">P1</text><text x="300" y="144">P2</text><text x="492" y="144">P3</text></g>
<g text-anchor="middle" font-size="56" font-weight="700"><text x="108" y="220">♠2</text><text x="300" y="220">♣8</text><text x="492" y="220" fill="#b91c1c">♥K</text></g>
<g text-anchor="middle" font-size="24"><text x="108" y="265">0点</text><text x="300" y="265" fill="#166534">中央：+8点</text><text x="492" y="265">0点</text></g>
<text x="300" y="332" text-anchor="middle" font-size="25" font-weight="700">P2のラウンド得点だけが8点増える</text>
<text x="300" y="367" text-anchor="middle" font-size="22">累積得点への加算は、3ターン後に判定</text></g></svg>